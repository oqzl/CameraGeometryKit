name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - Package.swift
      - Package.resolved
      - Sources/CameraGeometryKit/**
      - .github/workflows/documentation.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Swift-DocC site
        run: |
          swift package \
            --triple arm64-apple-ios18.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            --allow-writing-to-directory docs-site \
            generate-documentation \
            --target CameraGeometryKit \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path CameraGeometryKit \
            --output-path docs-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
